<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Propuesta Breick</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;500;600&display=swap">
<style>
/* Fondo blanco; morado, celeste y amarillo solo como detalle. Una sola tipografía con escala fija.
   Escala: h1 fluido / lead 18 / h3 20 / texto 16 / secundario 14 / numeral 56. Espaciado: 8 · 16 · 24 · 32. */
:root{
  --bg:#FFFFFF; --surface:#FFFFFF; --card:#F5F4F7; --tint:#F5F4F7; --tint-2:#ECEAF1; --ink:#1F1A2B; --ink-2:#5F5870; --line:#E1DEE8;
  --brand:#4B2582; --brand-ink:#4B2582; --on-brand:#FFFFFF;
  --accent:#E8B04A; --on-accent:#2B1D05; --sky:#5FB4DE;
  --sky-tint:#E4F3FA; --accent-tint:#FFF3D6;
  --font:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --fs-1:clamp(1.875rem,4vw,2.75rem); --fs-lead:1.125rem; --fs-3:1.25rem; --fs-body:1rem; --fs-sm:.875rem; --fs-num:clamp(2.75rem,6vw,3.5rem);
  --gap-s:8px; --gap-m:16px; --gap-l:24px; --gap-xl:32px; --pad:16px; --gutter:16px;
}
@media (min-width:640px){:root{--pad:20px;--gutter:32px}}
@media (min-width:1024px){:root{--gutter:40px}}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141218; --surface:#1B1920; --card:#211E28; --tint:#25222C; --tint-2:#2D2936; --ink:#F3F0F8; --ink-2:#B5AEC4; --line:#38343F;
  --brand:#7A4FD0; --brand-ink:#CDB6FF; --sky-tint:#173A58; --accent-tint:#3A2E14; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141218; --surface:#1B1920; --card:#211E28; --tint:#25222C; --tint-2:#2D2936; --ink:#F3F0F8; --ink-2:#B5AEC4; --line:#38343F;
  --brand:#7A4FD0; --brand-ink:#CDB6FF; --sky-tint:#173A58; --accent-tint:#3A2E14; color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 var(--fs-body)/1.5 var(--font);-webkit-font-smoothing:antialiased}
[hidden]{display:none!important}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--sky);outline-offset:2px}
.ic{display:block;flex:none}
h1,h2,h3,p,figure,ol{margin:0}
ol{padding:0;list-style:none}

.stripe{display:grid;grid-template-columns:repeat(3,1fr);height:3px}
.stripe i:nth-child(1){background:var(--brand)}
.stripe i:nth-child(2){background:var(--sky)}
.stripe i:nth-child(3){background:var(--accent)}

.logos{display:flex;align-items:center;gap:var(--gap-m);min-width:0}
.logos .bk{height:30px;width:auto;display:block}
.logos .div{width:1px;height:24px;background:var(--line);flex:none}
.klogo{height:15px;width:auto;aspect-ratio:59/20;color:var(--brand-ink);display:block;flex:none}
.logo-btn{border:0;background:none;padding:0;cursor:pointer}

/* acceso (desactivado por ahora) */
.gate{height:100%;overflow-y:auto;display:grid;grid-template-rows:auto minmax(0,1fr)}
.gate-form{display:flex;flex-direction:column;justify-content:center;gap:var(--gap-l);width:100%;max-width:560px;margin:auto;padding:var(--gap-xl) var(--gutter)}
.gate-form .logos .bk{height:48px}
.gate-form .klogo{height:24px}
.field{display:flex;flex-direction:column;gap:var(--gap-s)}
.field label{font-weight:500}
.pw{display:flex;border:1px solid var(--line);border-radius:4px;background:var(--surface)}
.pw:focus-within{border-color:var(--brand-ink)}
.pw input{flex:1;min-width:0;min-height:48px;padding:0 var(--gap-m);border:0;background:none;outline:0}
.pw button{display:flex;align-items:center;border:0;background:none;padding:0 var(--gap-m);color:var(--ink-2)}
.pw button:hover{color:var(--brand-ink)}
.err{color:#B3261E;font-size:var(--fs-sm)}

/* aplicación */
.app{height:100%;display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:auto auto minmax(0,1fr) auto}
.top{display:flex;align-items:center;justify-content:center;padding:8px var(--gutter);background:var(--surface);border-bottom:1px solid var(--line)}
.stage{overflow-y:auto;overflow-x:hidden;min-height:0}
.view{max-width:1120px;margin-inline:auto;padding:var(--gap-xl) var(--gutter) 48px;display:flex;flex-direction:column;gap:var(--gap-l);animation:fade .16s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}
@media (min-width:1024px){.view{gap:var(--gap-xl)}}

/* encabezado: título arriba; con foto oscurecida de fondo en cuatro secciones */
.head{display:flex;flex-direction:column;align-items:flex-start;gap:var(--gap-s)}
.head h1{font:600 var(--fs-1)/1.1 var(--font);letter-spacing:-.025em;text-wrap:balance;max-width:20ch}
.head .lead{font-size:var(--fs-lead);color:var(--ink-2);max-width:60ch;text-wrap:pretty}
.head.hero{justify-content:flex-end;min-height:clamp(150px,20vw,210px);padding:var(--gap-l) var(--pad);border-radius:4px;color:#fff;
  background:linear-gradient(rgba(16,10,24,.72),rgba(16,10,24,.5)),var(--bg-img) var(--pos,center)/cover #2a2330}
.head.hero .lead{color:rgba(255,255,255,.9)}
@media (min-width:640px){.head.hero{padding:var(--gap-xl)}}

/* tipografía */
h3{font:600 var(--fs-3)/1.25 var(--font);letter-spacing:-.01em}
.sub{font:300 var(--fs-sm)/1.4 var(--font);color:#7A7390}
.small{font-size:var(--fs-sm);color:var(--ink-2)}
.note{display:flex;gap:var(--gap-s);align-items:flex-start;color:var(--ink-2)}
.note .ic{margin-top:3px;color:var(--brand-ink)}

/* botones (controles) */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:var(--gap-s);min-height:44px;padding:0 var(--gap-l);border:1px solid var(--brand-ink);border-radius:4px;background:transparent;color:var(--brand-ink);font:600 1rem var(--font);text-decoration:none}
.btn:hover{background:var(--tint)}
.btn.solid{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}

/* tarjetas y bloques de texto */
.detail{background:var(--card);border:0;border-left:3px solid var(--brand-ink);border-radius:4px;padding:var(--pad);display:flex;flex-direction:column;gap:var(--gap-s)}
.tags{display:flex;flex-wrap:wrap;gap:var(--gap-s);align-items:center}
.tag{padding:4px 12px;border-radius:4px;background:var(--surface);font-weight:500;font-size:var(--fs-sm)}
.tags .arr{color:var(--brand-ink)}
.stack{display:flex;flex-direction:column;gap:var(--gap-m)}

/* inicio */
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--gap-m)}
.tile{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:var(--gap-m);min-height:120px;padding:var(--pad);text-align:left;background:var(--card);border:0;border-radius:4px}
.tile:hover{background:var(--tint-2)}
.tile .ti{color:var(--brand-ink)}
.tile b{display:block;font:600 var(--fs-body)/1.25 var(--font)}
.tile .d{display:block;margin-top:2px;font-size:var(--fs-sm);line-height:1.35;color:var(--ink-2)}
.tile .seen{position:absolute;top:var(--gap-m);right:var(--gap-m);width:20px;height:20px;border-radius:2px;background:var(--accent);color:var(--on-accent);display:grid;place-items:center}

/* 1 antecedentes: pasos con flechas */
.route{display:flex;align-items:flex-start;gap:var(--gap-s)}
.node{flex:1 1 0;min-width:0;display:flex;flex-direction:column;align-items:center;gap:var(--gap-s);padding:0;border:0;background:none;text-align:center}
.chev{flex:none;margin-top:14px;color:var(--ink-2)}
.sq{position:relative;width:48px;height:48px;border-radius:4px;display:grid;place-items:center;background:var(--card);color:var(--ink-2);border:0}
.node:hover .sq{background:var(--tint-2);color:var(--brand-ink)}
.node.on .sq{background:var(--surface);border:2px solid var(--brand-ink);color:var(--brand-ink);box-shadow:0 3px 0 var(--accent)}
.node b{display:block;font:600 var(--fs-body)/1.25 var(--font)}
.node .s{display:block;font-size:var(--fs-sm);color:var(--ink-2);line-height:1.3;margin-top:2px}

/* acordeón (objetivo, comercial) */
.acc{display:flex;flex-direction:column;border:0;border-radius:4px;background:var(--card);overflow:hidden}
.ai{position:relative;border-bottom:2px solid var(--bg);border-left:3px solid transparent}
.ai:last-child{border-bottom:0}
.ah{display:flex;align-items:center;gap:var(--gap-m);width:100%;padding:14px var(--pad);border:0;background:none;text-align:left}
.ah:hover{background:var(--tint-2)}
.ah b{flex:1;font:600 var(--fs-body)/1.3 var(--font)}
.ah .dot{width:12px;height:12px;border-radius:2px;flex:none}
.chv{display:flex;color:var(--ink-2);transition:transform .15s}
.ah .ai2{display:flex;color:var(--ink-2)}
.ai.on{border-left-color:var(--brand-ink)}
.ai.on .chv{transform:rotate(90deg);color:var(--brand-ink)}
.ai.on .ai2{color:var(--brand-ink)}
.ab{padding:0 var(--pad) var(--pad) calc(var(--pad) + 36px);color:var(--ink-2)}
.ab.tags{padding-top:0}

/* 2 objetivo */
.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:var(--gap-xl);align-items:center}
.venn{width:100%;max-width:440px;display:block;isolation:isolate;margin-inline:auto}
.vc{fill-opacity:.5;cursor:pointer;stroke:transparent;stroke-width:3}
.vc.p{fill:var(--brand)}.vc.e{fill:var(--sky)}.vc.m{fill:var(--accent)}
.vc.on{stroke:var(--ink);fill-opacity:.72}
.vl{cursor:pointer;font:600 18px var(--font)}
.vl text{pointer-events:none}

/* 3 modelo: pasos con barra de progreso automática */
.md{display:grid;grid-template-columns:minmax(240px,.8fr) minmax(0,1.2fr);gap:var(--gap-m);align-items:stretch}
.list{display:flex;flex-direction:column;border:0;border-radius:4px;background:var(--card);overflow:hidden}
.li{position:relative;display:flex;align-items:center;gap:var(--gap-m);padding:14px var(--pad);border:0;border-bottom:2px solid var(--bg);border-left:3px solid transparent;background:none;text-align:left;font:500 var(--fs-body) var(--font);flex:1}
.li:last-child{border-bottom:0}
.li .n{width:24px;font:600 var(--fs-body) var(--font);color:var(--ink-2);font-variant-numeric:tabular-nums}
.li b{flex:1;font-weight:inherit}
.li .ic{color:var(--ink-2)}
.li:hover{background:var(--tint-2)}
.li.on{border-left-color:var(--brand-ink);font-weight:600}
.li.on .n,.li.on .ic{color:var(--brand-ink)}
.bar{position:absolute;left:0;right:0;bottom:0;height:3px;background:transparent}
.bar::after{content:"";display:block;height:100%;width:0;background:var(--accent)}
.cy.on .bar::after{animation:fill 10s linear forwards}
.cycle:hover .cy.on .bar::after{animation-play-state:paused}
@keyframes fill{to{width:100%}}
.big{min-height:240px;justify-content:center}
.detail .bignum{font:600 var(--fs-num)/1 var(--font);letter-spacing:-.04em;color:var(--brand-ink)}

/* 4 frentes */
.tabs{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr) auto minmax(0,1fr);gap:var(--gap-s);align-items:stretch}
.tabs .join{align-self:center;color:var(--ink-2)}
.tab{display:flex;flex-direction:column;align-items:flex-start;gap:4px;padding:var(--pad);border-radius:4px;border:0;background:var(--card);text-align:left;min-width:0}
.tab small{font:500 var(--fs-sm) var(--font);color:var(--ink-2)}
.tab b{font:600 var(--fs-body)/1.25 var(--font)}
.tab span{font-size:var(--fs-sm);color:var(--ink-2);line-height:1.3}
.tab:hover{background:var(--tint-2)}
.tab.on{background:var(--surface);box-shadow:inset 0 0 0 1px var(--brand-ink),0 3px 0 var(--accent)}
.panel-h{display:flex;flex-direction:column;gap:var(--gap-s)}

/* 5 etapas */
.steps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--gap-s);align-items:end}
.step{display:flex;flex-direction:column;justify-content:flex-end;gap:var(--gap-s);min-height:var(--h);padding:var(--gap-l) var(--pad) var(--pad);border-radius:4px;background:var(--card);border:0;border-top:4px solid var(--c)}
.step .roman{font:600 var(--fs-num)/1 var(--font);letter-spacing:-.03em;color:var(--brand-ink)}
.step b{font:600 var(--fs-3)/1.25 var(--font)}

/* 6 equipo */
.team{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--gap-s)}
.person{display:flex;align-items:center;gap:var(--gap-m);padding:var(--pad);border:0;border-radius:4px;background:var(--card)}
.mono{width:48px;height:48px;border-radius:4px;display:grid;place-items:center;background:var(--bg);color:var(--brand-ink);font:600 var(--fs-body) var(--font);flex:none}
.person b{display:block;font:600 var(--fs-body)/1.25 var(--font)}
.person small{color:var(--ink-2);font-size:var(--fs-sm)}

/* 7 inversión */
.inv{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);gap:var(--gap-m);align-items:stretch}
.modes{display:flex;flex-direction:column;gap:var(--gap-s)}
.mode{display:flex;gap:var(--gap-m);align-items:center;padding:var(--pad);border-radius:4px;background:var(--card);border:0;font:600 var(--fs-body)/1.25 var(--font)}
.mode .ic{color:var(--brand-ink)}
.price{display:flex;flex-direction:column;gap:var(--gap-s);justify-content:center;padding:var(--gap-xl) var(--pad);border-radius:4px;background:var(--card);border:0;border-top:4px solid var(--accent)}
.price small{font-size:var(--fs-sm);color:var(--ink-2)}
.price big{font:600 var(--fs-num)/1 var(--font);letter-spacing:-.03em}
.price big span{font:400 var(--fs-body) var(--font);letter-spacing:0;margin-left:var(--gap-s);color:var(--ink-2)}

/* 8 comercial */
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:var(--gap-s)}
.stat{display:flex;flex-direction:column;gap:4px;padding:var(--pad);border:1px solid var(--line);border-top:4px solid var(--c);border-radius:4px;background:var(--surface)}
.stat small{display:block;font-size:var(--fs-sm);color:var(--ink-2)}
.stat b{display:block;font:600 var(--fs-3)/1.25 var(--font)}
.ci{display:flex;flex:none;color:var(--ink-2)}
.cards{display:flex;flex-direction:column;gap:var(--gap-s)}
.card{display:flex;align-items:flex-start;gap:var(--gap-m);padding:var(--pad);border-radius:4px;background:var(--card);color:inherit;text-decoration:none}
.card>span:nth-child(2){flex:1;min-width:0}
.card .ci{margin-top:1px}
.card b{display:block;font:600 var(--fs-body)/1.3 var(--font)}
.card p{color:var(--ink-2)}
a.card:hover{background:var(--tint-2)}
.card .go{color:var(--brand-ink)}
.ai2{display:flex;color:var(--ink-2)}

/* 9 próximos pasos */
.tl{display:flex;flex-direction:column;max-width:720px}
.tl li{position:relative;display:grid;grid-template-columns:32px minmax(0,1fr);gap:var(--gap-m);padding-bottom:var(--gap-l)}
.tl li:last-child{padding-bottom:0}
.tl li::before{content:"";position:absolute;left:15px;top:32px;bottom:0;width:1px;background:var(--line)}
.tl li:last-child::before{display:none}
.tl .n{width:32px;height:32px;border-radius:4px;display:grid;place-items:center;background:var(--card);color:var(--ink-2);border:0;font:600 var(--fs-sm) var(--font);font-variant-numeric:tabular-nums;position:relative}
.tl b{display:block;font:600 var(--fs-body)/1.3 var(--font);padding-top:4px}
.tl p{font-size:var(--fs-sm);color:var(--ink-2);margin-top:2px}
.tl .here .n{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.tl .fin .n{border:2px solid var(--brand-ink);color:var(--brand-ink)}
.here-tag{display:inline-block;margin-top:var(--gap-s);padding:2px 8px;border-radius:2px;background:var(--accent-tint);color:var(--ink);font:600 var(--fs-sm) var(--font)}

/* pie: navegación discreta */
.bottom{display:flex;align-items:center;justify-content:space-between;gap:var(--gap-m);padding:2px var(--gutter);padding-bottom:calc(2px + env(safe-area-inset-bottom,0px));background:var(--surface);border-top:1px solid var(--line)}
.navb{display:inline-flex;align-items:center;gap:var(--gap-s);min-height:40px;min-width:40px;justify-content:center;padding:0;border:0;background:none;color:var(--ink-2);font:500 .95rem var(--font)}
.navb:hover:not(:disabled){color:var(--brand-ink)}
.navb:disabled{opacity:.3;cursor:default}
.navb.next-b{color:var(--brand-ink);font-weight:600}
.mm-wrap{display:flex;align-items:center;gap:var(--gap-m);min-width:0}
.mini{display:flex;gap:4px}
.mm{position:relative;width:20px;height:28px;border:0;background:none;padding:0}
.mm::before{content:"";position:absolute;left:0;right:0;top:50%;height:3px;margin-top:-1.5px;background:var(--line)}
.mm:hover::before{background:var(--ink-2)}
.mm.seen::before{background:var(--sky)}
.mm.cur::before{background:var(--brand-ink)}
.mm-name{font:500 .9rem var(--font);color:var(--ink-2);white-space:nowrap;min-width:6.5rem}

/* adaptación */
@media (max-width:899px){
  .split,.md,.inv{grid-template-columns:minmax(0,1fr)}
  .tabs{grid-template-columns:minmax(0,1fr)}
  .tabs .join{display:none}
  .tiles{grid-template-columns:repeat(2,minmax(0,1fr))}
  .team{grid-template-columns:repeat(2,minmax(0,1fr))}
  .stats{grid-template-columns:repeat(2,minmax(0,1fr))}

  .mm-name{display:none}
}
@media (max-width:640px){
  .route{flex-direction:column;gap:var(--gap-m);position:relative}
  .route::before{content:"";position:absolute;left:24px;top:24px;bottom:24px;border-left:1px solid var(--line)}
  .chev{display:none}
  .node{flex-direction:row;text-align:left;gap:var(--gap-m);width:100%;flex:none;position:relative}
  .steps{grid-template-columns:minmax(0,1fr);align-items:stretch}
  .step{min-height:0;flex-direction:row;align-items:center;justify-content:flex-start;gap:var(--gap-m);padding:var(--pad);margin-left:calc(var(--i) * 24px)}
  .team,.tiles{grid-template-columns:minmax(0,1fr)}
  .tile{flex-direction:row;align-items:center;min-height:0}
  .tile .seen{top:50%;margin-top:-10px}
  .navb .lbl{display:none}
  .mm{width:14px}
  .mini{gap:3px}
  .logos{gap:var(--gap-s)}
  .logos .bk{height:28px}
  .klogo{height:14px}
}
@media (max-width:420px){.stats{grid-template-columns:minmax(0,1fr)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.acards{display:grid;grid-template-columns:repeat(var(--cols,4),minmax(0,1fr));gap:var(--gap-s)}
.acard{display:flex;flex-direction:column;gap:var(--gap-m);padding:var(--pad);border-radius:4px;background:var(--card)}
.at{display:flex;align-items:center;gap:var(--gap-s)}
.at b{font:600 var(--fs-body)/1.3 var(--font)}
.ai2{display:flex;flex:none;color:var(--brand-ink)}
.tags.sm{gap:6px}
.tags.sm .tag{padding:2px 8px;font-size:.8125rem;line-height:1.45}
.tags.sm .arr{display:flex}
@media (max-width:1099px){.acards{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:640px){.acards{grid-template-columns:minmax(0,1fr)}}

function pick(root,sel,fn,start=0){
  const bs=$$(sel,root);
  const set=i=>{bs.forEach((b,j)=>{b.classList.toggle('on',i===j);b.setAttribute('aria-pressed',i===j)});fn(i)};
  bs.forEach((b,i)=>b.addEventListener('click',()=>set(i)));
  set(start);return set;
}

function accInit(root,fn,start=0){
  const its=$$('.ai',root);
  const set=i=>{its.forEach((a,j)=>{const on=i===j;a.classList.toggle('on',on);$('.ah',a).setAttribute('aria-expanded',on);$('.ab',a).hidden=!on});if(fn)fn(i)};
  its.forEach((a,i)=>$('.ah',a).addEventListener('click',()=>set(i)));
  set(start);return set;
}

/* ---------- motor ---------- */
const ORDER=['home','antecedentes','objetivo','modelo','frentes','dinamica','equipo','inversion','comercial','pasos'];
function render(){
  const v=V[ORDER[cur]](),st=$('#stage'),s=cur?SECS[cur-1]:{img:'surtidos',pos:'center 40%'},hero=s.img;
  st.innerHTML=`<div class="view" id="view"><header class="head${hero?' hero':''}"${hero?` style="--bg-img:url(${IMG[s.img]});--pos:${s.pos}"`:''}>${v.panel}</header>${v.content}</div>`;
  st.scrollTop=0;
  const el=$('#view');
  if(v.init)v.init(el);
  $$('[data-go]',el).forEach(b=>b.addEventListener('click',()=>go(+b.dataset.go)));
  $('#mmName').textContent=cur?SECS[cur-1].short:'Inicio';
  $('#prev').disabled=cur===0;
  const last=cur===N;
  $('#nextLbl').textContent=last?'Salir':'Siguiente';
  $('#nextIc').innerHTML=I(last?'exit':'right',20);
  $('#next').setAttribute('aria-label',last?'Salir y volver al inicio':'Siguiente');
  $$('.mm').forEach((m,i)=>{m.classList.toggle('cur',i+1===cur);m.classList.toggle('seen',seen.has(i+1)&&i+1!==cur)});
  try{history.replaceState(null,'',cur?'#'+SECS[cur-1].id:location.pathname+location.search)}catch(e){}
}
function go(i){if(i<0||i>N)return;cur=i;if(i)seen.add(i);render()}

/* ---------- arranque ---------- */
const GATE=true; /* poner true para volver a pedir contraseña */
const PW='Koinor2026!';
const EYE='<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>',EYEOFF=EYE.replace('</svg>','<path d="M3 3l18 18"/></svg>');
$$('[data-i]').forEach(n=>n.innerHTML=I(n.dataset.i,+n.dataset.s||20));
$$('[data-logo]').forEach(i=>i.src=LOGO);
$('#pwShow').innerHTML=EYE;
$('#mini').innerHTML=SECS.map((s,i)=>`<button class="mm" data-n="${i+1}" aria-label="${s.name}" title="${s.name}"></button>`).join('');
$$('.mm').forEach(m=>m.addEventListener('click',()=>go(+m.dataset.n)));
$('#prev').addEventListener('click',()=>go(cur-1));
$('#next').addEventListener('click',()=>go(cur===N?0:cur+1));
$('#homeBtn').addEventListener('click',()=>go(0));
document.addEventListener('keydown',e=>{
  if($('#app').hidden)return;
  if(e.target.closest&&e.target.closest('input,textarea'))return;
  if(e.key==='ArrowRight')go(cur+1); else if(e.key==='ArrowLeft')go(cur-1); else if(e.key==='Escape'||e.key==='Home')go(0);
});
let tx=0,ty=0;
document.addEventListener('touchstart',e=>{tx=e.touches[0].clientX;ty=e.touches[0].clientY},{passive:true});
document.addEventListener('touchend',e=>{if($('#app').hidden)return;const dx=e.changedTouches[0].clientX-tx,dy=e.changedTouches[0].clientY-ty;if(Math.abs(dx)>80&&Math.abs(dy)<40){dx<0?go(cur+1):go(cur-1)}},{passive:true});
function unlock(){
  $('#gate').hidden=true; $('#app').hidden=false;
  const h=(location.hash||'').slice(1),i=SECS.findIndex(s=>s.id===h);
  if(i>=0){cur=i+1;seen.add(cur)}
  render();
}
$('#pwShow').addEventListener('click',e=>{const f=$('#pw'),show=f.type==='password';f.type=show?'text':'password';e.currentTarget.innerHTML=show?EYEOFF:EYE;e.currentTarget.setAttribute('aria-label',show?'Ocultar contraseña':'Mostrar contraseña');e.currentTarget.setAttribute('aria-pressed',String(show))});
$('#gateForm').addEventListener('submit',e=>{
  e.preventDefault();
  if($('#pw').value===PW){try{sessionStorage.setItem('breick-ok','1')}catch(_){}unlock()}
  else{$('#pwErr').hidden=false;$('#pw').select()}
});
$('#pw').addEventListener('input',()=>{$('#pwErr').hidden=true});
let ok=!GATE;try{ok=ok||sessionStorage.getItem('breick-ok')==='1'}catch(_){}
if(ok)unlock(); else{$('#gate').hidden=false;$('#pw').focus()}
</script>
